[project]
name = "holmes-mcp"
version = "0.1.0"
description = "MCP server that lets Claude Code ask HolmesGPT questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
    "redis>=5",
    "langfuse>=4,<5",
]

[project.scripts]
holmes-mcp = "holmes_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holmes_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
